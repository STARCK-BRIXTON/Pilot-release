# ================================================================
# .github/workflows/deploy-pre.yml
# ================================================================
# WORKFLOW 3 / 8
#
# RESPONSABILIDAD: Deploy automatico a pre-produccion.
# Se ejecuta en cada push a ramas release/* y hotfix/*.
# Incluye smoke tests e integration tests.
#
# TRIGGER:
#   push → release/**, hotfix/**
#
# RUNNER: github-hosted (o self-hosted si pre-prod es on-premise)
# ================================================================

name: "Deploy - Pre-production"

on:
  push:
    branches:
      - 'release/**'
      - 'hotfix/**'

concurrency:
  group: deploy-preproduction
  cancel-in-progress: false    # No cancelar deploys a pre-produccion

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: "Deploy a pre-produccion"
    runs-on: ubuntu-latest    # Cambiar a self-hosted si pre-prod es on-premise
    environment: pre-production

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Build para pre-produccion"
        run: |
          # ═══ REEMPLAZAR CON BUILD REAL ═══
          echo "Building para pre-produccion..."
          # ═══════════════════════════════
          echo "Build completado."

      - name: "Deploy a pre-produccion"
        run: |
          # ═══ REEMPLAZAR CON DEPLOY REAL ═══
          echo "Desplegando a pre-produccion..."
          # ════════════════════════════════════
          echo "Deploy completado."

      - name: "Smoke tests"
        run: |
          # ═══ REEMPLAZAR CON SMOKE TESTS REALES ═══
          echo "Ejecutando smoke tests..."
          # Ejemplo:
          # curl -sf http://pre.example.com/health || exit 1
          # ═════════════════════════════════════════
          echo "Smoke tests completados."

      - name: "Integration tests"
        run: |
          # ═══ REEMPLAZAR CON INTEGRATION TESTS REALES ═══
          echo "Ejecutando integration tests..."
          # Ejemplo:
          # npm run test:integration -- --env=pre
          # ════════════════════════════════════════════════
          echo "Integration tests completados."
